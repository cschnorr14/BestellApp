<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./img/fav_icon.svg">
</head>

<body>
    <div class="page_layout">
        <header>
            <div class="header_wrapper">
                <div class="logo"><img class="logo_header" src="./img/logo.png" alt="logo"></div>

                <div class="menu_bar"><img class="menu_button" src="./img/menu.png" alt="menu_button"></div>
            </div>
        </header>
        <section class="hero_section">
            <img class="hero_picture" src="./img/hero.png" alt="hero_picture">
            <img class="burger_logo" src="./img/burger_icon.png" alt="burger_logo">
            <div class="restaurant_info">
                <div class="title_recommendation">
                    <h1><span class="highlight_colour">Food</span>Corner</h1>
                    <div class="recommendation"><img class="star_icon" src="./img/star.png" alt="star">4,1 (317)</div>
                </div>
                <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
            <!--
            <section class="food_picture">
                <div id="category_mainDishes" class="categories"> <img src="" alt=""></div>
                <div id="category_sides" class="categories"><img src="" alt=""></div>
                <div id="category_dessert" class="categories"><img src="" alt=""></div>
                <div id="category_starters" class="categories"><img src="" alt=""></div>

            </section>
            -->
        </section>

        <div class="menu_categories" id="food_categories">
            <div class="main_dishes" id="mains_categories"></div>
        </div>
    </div>
    <footer>
        <div class="footer_wrapper">
            <img src="./img/footer.png" alt="footer_text">
        </div>
    </footer>

    <script src="./dishes.js"></script>
    <script src="./template.js"></script>
    <script src="./script.js"></script>
</body>

</html>
